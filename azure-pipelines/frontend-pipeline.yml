# Frontend CI/CD Pipeline 
# Triggers on changes to the frontend/ folder on main or develop branches 
trigger: 
  branches: 
    include: 
      - main 
      - develop 
  paths: 
    include: 
      - frontend/** 
 
variables: 
  - group: taskapp-variables 
  - name: imageTag 
    value: $(Build.BuildId) 
 
stages: 
 
  # ── Stage 1: Build & Push Docker Image ────────────────── 
  - stage: Build 
    displayName: 'Build and Push Docker Image' 
    jobs: 
      - job: BuildJob 
        pool: 
          vmImage: 'ubuntu-latest' 
        steps: 
 
          # Step 1: Check out code 
          - checkout: self 
 
          # Step 2: Login to Azure Container Registry 
          - task: Docker@2 
            displayName: 'Login to ACR' 
            inputs: 
              command: login 
              containerRegistry: acr-service-connection 
 
          # Step 3: Build Docker image with the Build ID as the tag 
          - task: Docker@2 
            displayName: 'Build Frontend Image' 
            inputs: 
              command: build 
              repository: $(DOCKER_REGISTRY)/$(FRONTEND_IMAGE_NAME) 
              dockerfile: frontend/Dockerfile 
              buildContext: frontend/ 
              arguments: '--build-arg REACT_APP_API_URL=http://localhost:3001' # Update with production URL if needed
              tags: | 
                $(imageTag) 
                latest 
 
          # Step 4: Push image to ACR 
          - task: Docker@2 
            displayName: 'Push Frontend Image to ACR' 
            inputs: 
              command: push 
              repository: $(DOCKER_REGISTRY)/$(FRONTEND_IMAGE_NAME) 
              tags: | 
                $(imageTag) 
                latest 
